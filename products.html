<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse Toy Haven products by category, age, price and more."
    />
    <meta name="theme-color" content="#17243a" />
    <meta name="author" content="Toy Haven" />
    <title>Toy Haven | Products</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/enhancements.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Toy Haven home"
        ><img src="images/logo.png" alt="Toy Haven logo" /><span
          class="brand-name"
          ><span>Toy</span> Haven</span
        ></a
      >
      <button
        class="menu-toggle"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        ☰
      </button>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a
        ><a class="active" href="products.html">Products</a
        ><a href="wishlist.html">Wishlist</a><a href="feedback.html">Support</a
        ><a href="cart.html">Cart <span class="cart-count">0</span></a>
      </nav>
    </header>
    <main>
      <section class="page-intro">
        <p class="eyebrow">THE COLLECTION</p>
        <h1>Find your next favourite.</h1>
        <p>
          Search and filter toys, games, learning sets, figurines and diecast
          cars.
        </p>
      </section>
      <section class="section products-section">
        <div class="catalogue-controls">
          <label class="search-box" for="product-search"
            ><span>Search products</span
            ><input
              id="product-search"
              type="search"
              placeholder="Try “car”, “robot” or “game”..."
              autocomplete="off"
          /></label>
          <label for="product-sort"
            ><span>Sort by</span
            ><select id="product-sort">
              <option value="featured">Featured</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="name">Name: A–Z</option>
              <option value="rating">Highest rated</option>
            </select></label
          >
          <label for="price-filter"
            ><span>Price</span
            ><select id="price-filter">
              <option value="">All prices</option>
              <option value="under5000">Under Rs. 5,000</option>
              <option value="5000to7000">Rs. 5,000–7,000</option>
              <option value="over7000">Over Rs. 7,000</option>
            </select></label
          >
          <label for="age-filter"
            ><span>Age</span
            ><select id="age-filter">
              <option value="">All ages</option>
              <option value="2+">2+</option>
              <option value="3+">3+</option>
              <option value="4+">4+</option>
              <option value="5+">5+</option>
              <option value="6+">6+</option>
              <option value="7+">7+</option>
              <option value="8+">8+</option>
              <option value="10+">10+</option>
            </select></label
          >
          <label class="sale-check"
            ><input id="sale-filter" type="checkbox" />
            <span>Discounted items only</span></label
          >
          <button
            id="clear-filters"
            class="button button-secondary small"
            type="button"
          >
            Clear filters
          </button>
        </div>
        <div
          id="category-filters"
          class="filters category-bar"
          aria-label="Product categories"
        ></div>
        <p
          id="product-result-count"
          class="result-count"
          aria-live="polite"
        ></p>
        <div id="product-grid" class="product-grid"></div>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <div id="product-modal" class="modal" hidden>
      <div class="modal-backdrop" aria-hidden="true"></div>
      <div
        class="modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button
          class="modal-close"
          type="button"
          aria-label="Close product details"
        >
          ×
        </button>
        <div class="modal-image"></div>
        <div class="modal-content">
          <p class="eyebrow modal-category"></p>
          <h2 id="modal-title" class="modal-title"></h2>
          <p class="modal-description"></p>
          <strong class="modal-price"></strong>
          <div class="button-row">
            <button type="button" class="button modal-add-cart">
              Add to Cart</button
            ><button type="button" class="button button-outline modal-wishlist">
              ♡ Wishlist
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
