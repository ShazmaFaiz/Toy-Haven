<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Complete your simulated Toy Haven order with validated delivery and payment details."
    />
    <meta name="theme-color" content="#17243a" />
    <meta name="author" content="Toy Haven" />
    <title>Toy Haven | Checkout</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/enhancements.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Toy Haven home"
        ><img src="images/logo.png" alt="Toy Haven logo" /><span
          class="brand-name"
          ><span>Toy</span> Haven</span
        ></a
      ><button
        class="menu-toggle"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        ☰
      </button>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="" href="index.html">Home</a
        ><a class="" href="products.html">Products</a
        ><a class="" href="wishlist.html">Wishlist</a
        ><a class="" href="feedback.html">Support</a
        ><a class="active" href="cart.html"
          >Cart <span class="cart-count">0</span></a
        >
      </nav>
    </header>
    <main>
      <section class="page-intro">
        <p class="eyebrow">CHECKOUT</p>
        <h1>Complete your order.</h1>
        <p>
          This is a simulated checkout for the assignment. No real payment is
          processed.
        </p>
      </section>
      <section class="section checkout-layout">
        <form id="checkout-form" class="form-card" novalidate>
          <h2>Delivery details</h2>
          <label for="full-name">Full Name</label
          ><input
            id="full-name"
            name="fullName"
            autocomplete="name"
            required
            minlength="2"
          /><label for="email">Email</label
          ><input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          /><label for="address">Delivery Address</label
          ><textarea
            id="address"
            name="address"
            rows="4"
            autocomplete="street-address"
            required
            minlength="8"
          ></textarea>
          <fieldset>
            <legend>Payment Method</legend>
            <label
              ><input type="radio" name="payment" value="Card" required />
              Card</label
            ><label
              ><input type="radio" name="payment" value="Cash on Delivery" />
              Cash on Delivery</label
            >
          </fieldset>
          <div id="card-fields" hidden>
            <label for="card-number">Card Number (simulation)</label
            ><input
              id="card-number"
              inputmode="numeric"
              autocomplete="off"
              placeholder="1234 5678 9012 3456"
              pattern="[0-9 ]{12,19}"
            /><label for="card-name">Name on Card</label
            ><input id="card-name" autocomplete="cc-name" />
          </div>
          <p id="checkout-error" class="form-message error" role="alert"></p>
          <button class="button" type="submit">Confirm Order</button>
        </form>
        <aside class="summary-card">
          <h2>Order Summary</h2>
          <div id="checkout-summary"></div>
        </aside>
      </section>
      <div id="checkout-success" class="success-panel" hidden></div>
    </main>
    <footer class="site-footer"></footer>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/checkout.js"></script>
  </body>
</html>
